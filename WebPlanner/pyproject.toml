[project]
name = "homeline"
version = "0.1.0"
description = "HOMELINE — NASA Space Apps 2026 (Martian Map) data pipeline"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "scipy",
    "numba",
    "rasterio",
    "pyproj",
    "shapely>=2",
    "geopandas",
    "scikit-image",
    "pillow",
    "opencv-python-headless",
    "requests",
    "pyyaml",
    "jsonschema",
    "cdasws",
]

[dependency-groups]
dev = ["pytest", "ruff"]
server = [
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pyjwt>=2.15.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
default-groups = ["dev", "server"]   # server: backend (D48); CI installs it for the server tests

[tool.pytest.ini_options]
# Backend tests (server/, tests/test_backend_*.py) stay out of a plain `pytest` (the ci gate for
# Pages); `make server-test` passes them as explicit paths, which --ignore-glob does not drop (D48).
testpaths = ["pipeline", "tools", "tests"]
pythonpath = ["."]
addopts = "-q --ignore-glob=tests/test_backend_*.py"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", "data", "tools/discovery"]  # D0 one-off probe scripts, kept as a provenance record

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
