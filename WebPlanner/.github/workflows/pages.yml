# GitHub Pages deploy for the static web app (F17). Written by WS5; .github/workflows/ is owned by WS6 + C, so C/WS6 review it.
# Real data only: builds web/ with VITE_DATA=real and deploys web/dist, which then holds
# web/public/data/ (filled by `make web`) and never data-dummy/. Dummy builds are never deployed.
# Gated on CI: runs after the "ci" workflow succeeds for a push to main (and deploys exactly the
# commit CI tested), or by manual dispatch, which first checks that "ci" succeeded on that commit.
# The gate keys on "ci" only, never on "server" (server.yml): the static site never depends on
# the backend (D48; the static fallback is never cut).
name: pages

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch: # real data only; no inputs (a dummy build can never reach the public site)

permissions:
  actions: read # manual dispatch: look up the ci run for the commit
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_run fires on every ci completion: only a successful ci run for a push to main deploys.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      VITE_DATA: real # fixed: never read from an input
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Manual run - require a successful ci run on this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci --commit "$SHA" --status success --json databaseId --jq length)
          echo "successful ci runs on $SHA: $n"
          test "$n" -gt 0 || { echo "::error::ci has not succeeded on $SHA; not deploying"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Refuse dummy mode
        run: test "$VITE_DATA" = real || { echo "::error::VITE_DATA=$VITE_DATA; only real builds deploy"; exit 1; }
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked -p 3.11 --no-group server  # static build: no backend deps (D48)
      - name: Contracts + no "dummy" true in web/public/data (tools/validate_contracts.py)
        run: uv run --no-sync python tools/validate_contracts.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Type check
        run: npm run typecheck
        working-directory: web
      - name: Unit tests (vitest)
        run: npm test
        working-directory: web
      - name: Vite build (real data)
        run: npx vite build
        working-directory: web
        env:
          # Live layer (F23) against the self-hosted API. With the API down, the site falls back to
          # the static plans and shows the offline label (kit rule 4), so the static site still
          # never depends on the backend (D48).
          VITE_LIVE: "1"
          VITE_API_BASE: ${{ vars.HL_API_URL }}
          # route editing hidden on the published site until the team lead's OK (D115/D116)
          VITE_ROUTE_EDIT: "0"
      - name: Built site has no dummy tree and no dummy-flagged file
        run: |
          test ! -e web/dist/data-dummy || { echo "::error::dist contains data-dummy/"; exit 1; }
          python3 - <<'EOF'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path("web/dist/data").rglob("*"):
              if p.suffix in (".json", ".geojson"):
                  try:
                      doc = json.loads(p.read_text(encoding="utf-8"))
                  except (OSError, ValueError):
                      continue
                  if isinstance(doc, dict) and doc.get("dummy") is True:
                      bad.append(str(p))
          for b in bad:
              print(f"::error::{b} has a top-level dummy: true")
          sys.exit(1 if bad else 0)
          EOF
      - name: App size without data (brief WS5 - under 5 MB)
        working-directory: web
        run: |
          kb=$(du -sk --exclude=data --exclude=data-dummy dist | cut -f1)
          echo "dist without data: ${kb} KiB"
          test "$kb" -lt 5120
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
