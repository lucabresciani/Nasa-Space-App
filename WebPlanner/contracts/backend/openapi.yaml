openapi: 3.1.0
info:
  title: HOMELINE live API
  version: 1.2.0
  description: |
    Optional live layer of HOMELINE (F23-F36, D40, D48). The static app works without it.
    Every live result carries the label "Computed live · not part of the validated scorecard".
    Auth: G = guest (no security), U = Supabase login (Bearer JWT), K = session key (X-HL-Key
    header), T = team token (X-HL-Team header). Limits, ranges and timeouts come from
    config/backend.yaml. Backend contract family v1.2.0 (contracts/backend/, frozen at P0, D50; v1.2.0 adds the route, D97).
    Source: backend spec §5 (docs/backend.md).
  license: {name: Apache-2.0, identifier: Apache-2.0}
servers:
  - url: /api/v1
tags:
  - {name: meta, description: "health, version, defaults"}
  - {name: compute, description: "pads, jobs (WS11)"}
  - {name: results, description: immutable result trees by hash (WS11)}
  - {name: plans, description: "library, share codes, import, account (WS12)"}
  - {name: sim, description: "bundle, world, live sessions (WS14)"}
  - {name: ops, description: "conditions refresh, admin (WS12)"}
components:
  securitySchemes:
    supabase: {type: http, scheme: bearer, bearerFormat: JWT}
    sessionKey: {type: apiKey, in: header, name: X-HL-Key}
    teamToken: {type: apiKey, in: header, name: X-HL-Team}
  parameters:
    Hash:
      name: hash
      in: path
      required: true
      schema: {type: string, pattern: "^[0-9a-f]{16}$"}
    PlanId:
      name: id
      in: path
      required: true
      schema: {type: string}
    SessionId:
      name: id
      in: path
      required: true
      schema: {type: string}
  responses:
    Error:
      description: error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RateLimited:
      description: rate limit or queue full (retry_after_s set; Retry-After header)
      headers:
        Retry-After: {schema: {type: integer}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    PlanInputs: {$ref: plan_inputs.schema.json}
    Job: {$ref: job.schema.json}
    RunRecord: {$ref: run_record.schema.json}
    TelemetryBatch: {$ref: "telemetry.schema.json#/$defs/batch"}
    StateEvent: {$ref: "telemetry.schema.json#/$defs/state_event"}
    Command: {$ref: "telemetry.schema.json#/$defs/command"}
    CommandRequest: {$ref: "telemetry.schema.json#/$defs/command_request"}
    Utc:
      type: string
      pattern: "^\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\d(\\.\\d+)?Z$"
    ShareCode:
      description: D55, HL- + 6 Crockford base32 characters (config/backend.yaml plans.share_code)
      type: string
      pattern: "^HL-[0-9A-HJKMNP-TV-Z]{6}$"
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string, description: machine-readable code}
        detail: {description: human-readable text or a validation error list}
        retry_after_s: {type: [integer, "null"]}
        allowed: {type: [object, "null"], description: "the allowed range for an out-of-range input (F26), e.g. {min, max}"}
        stop:
          type: [integer, "null"]
          minimum: 0
          description: >-
            v1.2.0 (D97): for a 422 on a route, the index into inputs.route.stops of the stop the error
            names (null when it concerns the whole route). Codes: route_too_many_stops (route.max_stops),
            route_too_many_free_points (route.max_free_points), route_stop_spacing (two stops, or a stop
            and the pad, closer than route.min_stop_spacing_m), route_station_unknown,
            route_station_duplicate, route_point_outside_grid, route_point_unassessed,
            route_point_not_walkable, route_point_unreachable (no path from the pad), route_label_too_long,
            route_mode_conflict (route ordered together with stations.mode set/order or stations.custom).
            An ordered route that breaks a limit is not a 422: the job answers with
            run_record.feasibility.
    Health:
      type: object
      required: [ok, engine_warm, queue_length, heavy_jobs]
      properties:
        ok: {type: boolean}
        engine_warm: {type: boolean, description: true only after the Numba warm-up}
        queue_length: {type: integer, minimum: 0}
        heavy_jobs: {enum: ["on", "off"], description: off when the kill switch HL_HEAVY_JOBS_OFF is set}
    EngineVersion:
      type: object
      required: [engine_tree, commit, config_hash, web_contract_version, backend_contract_version, terrain_hash]
      properties:
        engine_tree: {type: string, pattern: "^[0-9a-f]{40}$"}
        commit: {type: string, pattern: "^[0-9a-f]{40}$"}
        config_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        web_contract_version: {type: string}
        backend_contract_version: {type: string}
        bundle_contract_version: {type: string}
        terrain_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        world_version: {type: string}
    Defaults:
      type: object
      required: [inputs, ranges, stations, pads]
      properties:
        inputs: {$ref: "#/components/schemas/PlanInputs"}
        ranges: {type: object, description: config/backend.yaml ranges with defaults resolved}
        stations: {type: array, items: {type: object}, description: as stations.json}
        pads: {type: array, items: {type: object}, description: "official and picker pads, as scenarios/pads/index.json pads"}
    LonLat:
      type: object
      required: [lon, lat]
      additionalProperties: false
      properties:
        lon: {type: number}
        lat: {type: number}
    PadCheck:
      type: object
      required: [valid, reason]
      properties:
        valid: {type: boolean}
        reason: {enum: [null, slope, unknown_terrain, disc_off_grid, outside_grid]}
        detail: {type: string}
        nearest_valid:
          type: [object, "null"]
          properties:
            lon: {type: number}
            lat: {type: number}
            distance_m: {type: number}
    PadScreen:
      type: object
      required: [pad, stations, feasible_evas, label]
      properties:
        pad: {$ref: "#/components/schemas/LonLat"}
        stations:
          type: array
          items:
            type: object
            required: [id, reachable]
            properties:
              id: {type: string}
              t_out_min: {type: [number, "null"]}
              t_home_min: {type: [number, "null"]}
              reachable: {type: boolean}
        feasible_evas: {type: integer, minimum: 0, description: D21 score}
        best_route:
          type: [object, "null"]
          properties:
            order: {type: array, items: {type: string}}
            total_min: {type: number}
        label: {type: string}
    ReplanInputs:
      type: object
      description: F32, the state to replan from
      required: [t_eva_s, pos, o2_left_L, stations_done]
      additionalProperties: false
      properties:
        session_id: {type: string}
        from_hash: {type: string, pattern: "^[0-9a-f]{16}$"}
        t_eva_s: {type: number, minimum: 0}
        pos:
          type: object
          required: [x_m, y_m]
          properties:
            x_m: {type: number}
            y_m: {type: number}
        o2_left_L: {type: number, minimum: 0}
        stations_done: {type: array, items: {type: string}}
    JobRequest:
      type: object
      required: [type, inputs]
      additionalProperties: false
      properties:
        type: {enum: [plan, siting, replan]}
        inputs: {$ref: "#/components/schemas/PlanInputs"}
        replan: {$ref: "#/components/schemas/ReplanInputs"}
    ImportResult:
      type: object
      required: [hash, inputs]
      properties:
        hash: {type: string, pattern: "^[0-9a-f]{16}$"}
        inputs: {$ref: "#/components/schemas/PlanInputs"}
        computed: {type: boolean, description: true when a result for the hash is already cached}
        range_flags: {type: array, items: {type: object}}
    Visibility: {enum: [private, link]}
    PlanSave:
      type: object
      required: [inputs]
      additionalProperties: false
      properties:
        title: {type: string}
        notes: {type: string}
        visibility: {$ref: "#/components/schemas/Visibility"}
        inputs: {$ref: "#/components/schemas/PlanInputs"}
    PlanPatch:
      type: object
      additionalProperties: false
      properties:
        title: {type: string}
        notes: {type: string}
        visibility: {$ref: "#/components/schemas/Visibility"}
        inputs: {$ref: "#/components/schemas/PlanInputs", description: a new version}
    Plan:
      type: object
      required: [id, title, visibility, current_version, hash, created_utc, updated_utc]
      properties:
        id: {type: string}
        title: {type: string}
        notes: {type: string}
        visibility: {$ref: "#/components/schemas/Visibility"}
        share_code: {oneOf: [{$ref: "#/components/schemas/ShareCode"}, {type: "null"}]}
        current_version: {type: integer, minimum: 1}
        hash: {type: string, pattern: "^[0-9a-f]{16}$"}
        inputs: {$ref: "#/components/schemas/PlanInputs"}
        stale: {type: boolean, description: "computed with an older engine · recompute"}
        created_utc: {$ref: "#/components/schemas/Utc"}
        updated_utc: {$ref: "#/components/schemas/Utc"}
    PlanVersion:
      type: object
      required: [number, inputs, hash, engine_tree, config_hash, created_utc]
      properties:
        number: {type: integer, minimum: 1}
        inputs: {$ref: "#/components/schemas/PlanInputs"}
        hash: {type: string, pattern: "^[0-9a-f]{16}$"}
        engine_tree: {type: string}
        config_hash: {type: string}
        created_utc: {$ref: "#/components/schemas/Utc"}
    SharedPlan:
      type: object
      required: [code, title, hash, inputs]
      properties:
        code: {$ref: "#/components/schemas/ShareCode"}
        title: {type: string}
        hash: {type: string, pattern: "^[0-9a-f]{16}$"}
        inputs: {$ref: "#/components/schemas/PlanInputs"}
    SessionCreate:
      type: object
      required: [hash]
      additionalProperties: false
      properties:
        hash: {type: string, pattern: "^[0-9a-f]{16}$"}
    SessionCreated:
      type: object
      required: [id, write_key, view_key]
      properties:
        id: {type: string}
        write_key: {type: string, description: "for the simulator; shown once, stored hashed"}
        view_key: {type: string, description: "for the console; shown once, stored hashed"}
    RunLog:
      type: object
      required: [id, session, summary, created_utc]
      properties:
        id: {type: string}
        session: {type: string}
        summary: {type: object, description: "planned vs simulated distance, time, O2, lowest margin, alarms (WS14 task 6)"}
        created_utc: {$ref: "#/components/schemas/Utc"}
    AdminStatus:
      type: object
      properties:
        queue_length: {type: integer}
        running: {type: integer}
        job_seconds_p50: {type: number}
        cache_gb: {type: number}
        errors_last_h: {type: integer}
        heavy_jobs: {enum: ["on", "off"]}
paths:
  /health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Up, engine warm, queue length (G)
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}}
  /engine/version:
    get:
      tags: [meta]
      operationId: getEngineVersion
      summary: Engine tree and commit, config hash, contract versions, terrain hash (G)
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/EngineVersion"}}}}
  /defaults:
    get:
      tags: [meta]
      operationId: getDefaults
      summary: Default plan inputs, ranges, stations, official and picker pads (G)
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Defaults"}}}}
  /pads/validate:
    post:
      tags: [compute]
      operationId: validatePad
      summary: Pad validity by the D21 rule and the nearest valid block (G)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/LonLat"}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/PadCheck"}}}}
        "422": {$ref: "#/components/responses/Error"}
  /pads/screen:
    post:
      tags: [compute]
      operationId: screenPad
      summary: Instant preview from the station fields (G)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlanInputs"}
            examples:
              official: {externalValue: examples/plan_inputs.official.json}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/PadScreen"}}}}
        "422": {$ref: "#/components/responses/Error"}
  /jobs:
    post:
      tags: [compute]
      operationId: createJob
      summary: Start a job (plan, siting, replan); identical inputs attach to the existing job (G, rate-limited)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/JobRequest"}}}
      responses:
        "202":
          description: accepted (or attached)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
              examples:
                queued: {externalValue: examples/job.queued.json}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Error"}
  /jobs/{id}:
    get:
      tags: [compute]
      operationId: getJob
      summary: Status, stage, progress, result URL (G)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
              examples:
                running: {externalValue: examples/job.running.json}
        "404": {$ref: "#/components/responses/Error"}
  /results/{hash}/provenance:
    get:
      tags: [results]
      operationId: getProvenance
      summary: Run record (G)
      parameters:
        - {$ref: "#/components/parameters/Hash"}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunRecord"}
              examples:
                live: {externalValue: examples/run_record.live.json}
                route_infeasible: {externalValue: examples/run_record.route_infeasible.json}
                route_free: {externalValue: examples/run_record.route_free.json}
        "404": {$ref: "#/components/responses/Error"}
  /results/{hash}/{path}:
    get:
      tags: [results]
      operationId: getResultFile
      summary: Result tree file, immutable; same file names and contracts as web/public/data plus run_record.json (G)
      description: "{path} may contain slashes (e.g. scenarios/index.json); served by Caddy from the cache."
      parameters:
        - {$ref: "#/components/parameters/Hash"}
        - {name: path, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "file (JSON, GeoJSON or PNG)"}
        "404": {$ref: "#/components/responses/Error"}
  /plans/import:
    post:
      tags: [plans]
      operationId: importPlan
      summary: Validate an uploaded plan_inputs.json (size cap limits.upload_max_bytes) and return its hash (G)
      description: "503 (v1.1.0): no engine identity, error server_data_missing or engine_identity_unavailable, as POST /jobs."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlanInputs"}
            examples:
              route_ordered: {externalValue: examples/plan_inputs.route_ordered.json}
              route_free: {externalValue: examples/plan_inputs.route_free.json}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/ImportResult"}}}}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /plans:
    get:
      tags: [plans]
      operationId: listPlans
      summary: List my plans (U)
      security: [{supabase: []}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Plan"}}}}}
        "401": {$ref: "#/components/responses/Error"}
    post:
      tags: [plans]
      operationId: savePlan
      summary: Save a plan (version 1) (U)
      security: [{supabase: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/PlanSave"}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Plan"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /plans/by-code/{code}:
    get:
      tags: [plans]
      operationId: getPlanByCode
      summary: Resolve a share code (HL- + 6 Crockford base32, D55) to inputs and hash (G)
      parameters:
        - {name: code, in: path, required: true, schema: {$ref: "#/components/schemas/ShareCode"}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/SharedPlan"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /plans/{id}:
    get:
      tags: [plans]
      operationId: getPlan
      summary: Read (U owner)
      security: [{supabase: []}]
      parameters: [{$ref: "#/components/parameters/PlanId"}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Plan"}}}}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      tags: [plans]
      operationId: updatePlan
      summary: Rename, notes, visibility, new inputs version (U owner)
      security: [{supabase: []}]
      parameters: [{$ref: "#/components/parameters/PlanId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/PlanPatch"}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Plan"}}}}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [plans]
      operationId: deletePlan
      summary: Delete (U owner)
      security: [{supabase: []}]
      parameters: [{$ref: "#/components/parameters/PlanId"}]
      responses:
        "204": {description: deleted}
        "404": {$ref: "#/components/responses/Error"}
  /plans/{id}/versions:
    get:
      tags: [plans]
      operationId: listPlanVersions
      summary: Version list, newest first, last plans.versions_kept (U owner)
      security: [{supabase: []}]
      parameters: [{$ref: "#/components/parameters/PlanId"}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/PlanVersion"}}}}}
        "404": {$ref: "#/components/responses/Error"}
  /plans/{ref}/bundle:
    get:
      tags: [sim]
      operationId: getPlanBundle
      summary: D41 plan bundle zip built by tools.make_bundle.build_plan_bundle (ref = result hash, plan id or share code) (G for hash and code; U owner for a plan id)
      security: [{}, {supabase: []}]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: zip (contracts/bundle/), content: {application/zip: {schema: {type: string, contentMediaType: application/zip}}}}
        "404": {$ref: "#/components/responses/Error"}
  /world/{version}/{path}:
    get:
      tags: [sim]
      operationId: getWorldFile
      summary: World pack and tiles (G)
      parameters:
        - {name: version, in: path, required: true, schema: {type: string}}
        - {name: path, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: file}
        "404": {$ref: "#/components/responses/Error"}
  /sessions:
    post:
      tags: [sim]
      operationId: createSession
      summary: Start a live session from a result hash; returns id, write key and view key, shown once (G, rate-limited)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SessionCreate"}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/SessionCreated"}}}}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /sessions/{id}/telemetry:
    post:
      tags: [sim]
      operationId: postTelemetry
      summary: Telemetry batch in; state and pending commands out (K write)
      security: [{sessionKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TelemetryBatch"}
            examples:
              replay: {externalValue: examples/telemetry.batch.json}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StateEvent"}
              examples:
                state: {externalValue: examples/telemetry.state_event.json}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /sessions/{id}/stream:
    get:
      tags: [sim]
      operationId: streamSession
      summary: Server-sent events, one StateEvent (JSON) per data line (K view)
      security: [{sessionKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses:
        "200":
          description: event stream; each event's data is a StateEvent
          content:
            text/event-stream:
              schema: {type: string}
        "403": {$ref: "#/components/responses/Error"}
  /sessions/{id}/commands:
    post:
      tags: [sim]
      operationId: postCommand
      summary: Command to the simulator, delivered with the next telemetry response (K view)
      security: [{sessionKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CommandRequest"}}}
      responses:
        "202": {description: queued, content: {application/json: {schema: {$ref: "#/components/schemas/Command"}}}}
        "403": {$ref: "#/components/responses/Error"}
  /sessions/{id}/end:
    post:
      tags: [sim]
      operationId: endSession
      summary: Close the session and store the run log (K)
      security: [{sessionKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/RunLog"}}}}
        "403": {$ref: "#/components/responses/Error"}
  /runs/{id}:
    get:
      tags: [sim]
      operationId: getRun
      summary: Run log (K)
      security: [{sessionKey: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/RunLog"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /conditions/latest:
    get:
      tags: [ops]
      operationId: getLatestConditions
      summary: Refreshed conditions (F34); frozen values stay the scorecard default (G)
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object}}}}
        "404": {$ref: "#/components/responses/Error"}
  /me:
    delete:
      tags: [plans]
      operationId: deleteMe
      summary: Delete my account and data (profile, plans, versions, owned sessions) (U)
      security: [{supabase: []}]
      responses:
        "204": {description: deleted}
        "401": {$ref: "#/components/responses/Error"}
  /admin/status:
    get:
      tags: [ops]
      operationId: getAdminStatus
      summary: Queue, job times, cache size, error rate (T)
      security: [{teamToken: []}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/AdminStatus"}}}}
        "403": {$ref: "#/components/responses/Error"}
  /admin/heavy-jobs:
    post:
      tags: [ops]
      operationId: setHeavyJobs
      summary: Kill-switch control; "off" refuses new heavy jobs, "on" accepts them again; answers the resulting status (T, v1.1.0)
      security: [{teamToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [heavy_jobs]
              additionalProperties: false
              properties:
                heavy_jobs: {enum: ["on", "off"]}
